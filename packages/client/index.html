<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Combat Arena -- 0. lepcso spike</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1117; }
      canvas { display: block; }

      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 12px 14px;
        background: rgba(13, 17, 23, 0.82);
        border: 1px solid #30363d;
        border-radius: 8px;
        color: #e6edf3;
        font-size: 12px;
        line-height: 1.7;
        min-width: 260px;
        pointer-events: none;
        user-select: none;
      }
      #hud h2 {
        margin: 0 0 8px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #7d8590;
      }
      #hud .row { display: flex; justify-content: space-between; gap: 16px; }
      #hud .label { color: #7d8590; }
      #hud .val { color: #e6edf3; font-variant-numeric: tabular-nums; }
      #hud .val.good { color: #3fb950; }
      #hud .val.warn { color: #d29922; }
      #hud .val.bad { color: #f85149; }
      #hud hr { border: 0; border-top: 1px solid #30363d; margin: 8px 0; }

      .wheel-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        margin-top: 4px;
      }
      .wheel {
        padding: 4px 6px;
        border: 1px solid #30363d;
        border-radius: 4px;
        font-size: 11px;
        text-align: center;
      }
      .wheel.ok { border-color: #2ea043; color: #3fb950; }
      .wheel.hurt { border-color: #9e6a03; color: #d29922; }
      .wheel.broken { border-color: #da3633; color: #f85149; text-decoration: line-through; }
      .wheel.air { opacity: 0.45; }

      #help {
        position: fixed;
        bottom: 12px;
        left: 12px;
        padding: 10px 14px;
        background: rgba(13, 17, 23, 0.82);
        border: 1px solid #30363d;
        border-radius: 8px;
        color: #7d8590;
        font-size: 11px;
        line-height: 1.8;
        pointer-events: none;
        user-select: none;
      }
      #help b { color: #e6edf3; font-weight: 600; }

      /*
       * Celkereszt: az eger utan mozog, es a rakéta oda repul.
       * A vaszon folott elrejtjuk a rendszer-kurzort, de a debug
       * panel folott meghagyjuk -- ott csuszkakat kell huzni.
       */
      canvas { cursor: none; }

      #crosshair {
        position: fixed;
        width: 26px;
        height: 26px;
        margin: -13px 0 0 -13px;
        pointer-events: none;
        z-index: 20;
      }
      #crosshair::before,
      #crosshair::after {
        content: "";
        position: absolute;
        background: #f0a020;
        box-shadow: 0 0 3px rgba(0, 0, 0, 0.9);
      }
      /* Vizszintes es fuggoleges szar, kozepen resel -- igy a celpont
         maga nem takarodik el. */
      #crosshair::before {
        left: 0;
        right: 0;
        top: 12px;
        height: 2px;
        clip-path: polygon(0 0, 38% 0, 38% 100%, 0 100%, 62% 0, 100% 0, 100% 100%, 62% 100%);
      }
      #crosshair::after {
        top: 0;
        bottom: 0;
        left: 12px;
        width: 2px;
        clip-path: polygon(0 0, 100% 0, 100% 38%, 0 38%, 0 62%, 100% 62%, 100% 100%, 0 100%);
      }

      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #7d8590;
        font-size: 13px;
        background: #0d1117;
      }

      #debug-panel {
        position: fixed;
        top: 12px;
        right: 12px;
        bottom: 12px;
        width: 300px;
        padding: 12px 14px;
        background: rgba(13, 17, 23, 0.88);
        border: 1px solid #30363d;
        border-radius: 8px;
        color: #e6edf3;
        font-size: 11px;
        overflow-y: auto;
        user-select: none;
      }
      #debug-panel.collapsed { width: auto; height: auto; bottom: auto; overflow: visible; }
      #debug-panel.collapsed .debug-body,
      #debug-panel.collapsed .debug-actions { display: none; }

      #debug-panel .debug-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      #debug-panel .debug-header h2 {
        margin: 0;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #7d8590;
      }
      #debug-panel button {
        background: none;
        border: 1px solid #30363d;
        color: #7d8590;
        border-radius: 4px;
        font-size: 10px;
        padding: 2px 8px;
        cursor: pointer;
        font-family: inherit;
      }
      #debug-panel button:hover { color: #e6edf3; border-color: #6e7681; }

      .debug-actions {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #21262d;
      }
      .debug-actions button { flex: 1; }

      #debug-panel h3 {
        margin: 14px 0 6px;
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #58a6ff;
        border-top: 1px solid #21262d;
        padding-top: 10px;
      }
      #debug-panel h3:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }

      .slider-row { margin-bottom: 9px; }
      .slider-row .slider-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #adbac7;
        margin-bottom: 2px;
      }
      .slider-row .slider-label-right {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .slider-row .slider-value {
        color: #3fb950;
        font-variant-numeric: tabular-nums;
      }
      .slider-row .slider-reset {
        background: none;
        border: none;
        color: #7d8590;
        font-size: 11px;
        line-height: 1;
        padding: 0;
        cursor: pointer;
      }
      .slider-row .slider-reset:hover { color: #e6edf3; }
      .slider-row input[type="range"] {
        width: 100%;
        accent-color: #3fb950;
        cursor: pointer;
      }
      .slider-row .slider-hint {
        color: #7d8590;
        font-size: 10px;
        line-height: 1.4;
        margin-top: 3px;
      }
    </style>
  </head>
  <body>
    <div id="loading">Fizikai motor betoltese...</div>
    <div id="crosshair" hidden></div>
    <div id="hud" hidden></div>
    <div id="help" hidden>
      <b>W/S</b> gaz / fek &nbsp; <b>A/D</b> kormany &nbsp;
      <b>Space</b> kezifek &nbsp; <b>Shift</b> boost &nbsp; <b>Bal egergomb</b> / <b>F</b> raketa (egerrel celzol) &nbsp; <b>R</b> reset<br />
      <b>1 2 3 4</b> kerek kiloves (FL FR RL RR) &nbsp; <b>0</b> kerekek javitasa
    </div>
    <div id="debug-panel" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
