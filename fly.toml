# Fly.io konfiguracio -- lasd terv 15.7.
#
# FONTOS: a szerver ALLAPOTOT tart a memoriaban (szobak, meccsek), es a
# jatekosok WebSocketen kapcsolodnak hozza. Ezert:
#   - EGY peldany fut (nincs skalazas tobb gepre): ket peldany kozott a
#     szobak nem latszananak, es a lobby listaja is szakadozna,
#   - tetlensegkor a gep FELFUGGESZTHETO, de nem allithato le: a
#     felfuggesztes (suspend) lementi a memoriat is, tehat a szobak
#     tulelik; egy teljes leallas (stop) minden futo meccset eldobna.

app = "car-combat-arena"
primary_region = "fra"   # Frankfurt -- Budapesthez a legkozelebbi jo valasztas

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # TETLENSEGKOR FELFUGGESZTES.
  #
  # A 'suspend' a memoriat is lementi, es a kovetkezo keresre onnan all
  # vissza -- a memoriaban tartott szobak es meccsek tehat megmaradnak
  # (ellentetben a 'stop'-pal, ami egy uj, ures folyamatot inditana).
  # A Fly proxyja a nyitott KAPCSOLATOKAT szamolja, ezert amig barki
  # jatszik -- a WebSocket vegig nyitva van --, a gep nem alszik el.
  #
  # A min_machines_running ezert 0: 1-nel a Fly mindig eloben tartana
  # egy gepet, es a felfuggesztes soha nem sulne el.
  #
  # A Fly nem minden esetben tud felfuggeszteni (ilyenkor leallitasra
  # valt) -- a szerver egy ujraindulast amugy is elvisel, csak a nyitott
  # szobak vesznek el; a kliens visszater a lobbyba.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    # Egy Node folyamat, memoriaban tarolt szobakkal: a terv szerint
    # MVP-ben ez eleg. A hatarok bőven a varhato letszam folott vannak.
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
